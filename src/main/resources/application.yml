micronaut:
  application:
    name: bit-recall
  
  # Security Configuration
  security:
    enabled: true
    authentication: bearer
    token:
      jwt:
        enabled: true
        # Use environment variable in production: JWT_SECRET
        secret: ${JWT_SECRET}
        generator:
          access-token:
            expiration: 3600  # 1 hour in seconds
        validation:
          claims-validators:
            expiration: true

datasources:
  default:
    url: jdbc:postgresql://localhost:5433/bit-recall?options=-c%20timezone=Asia/Kolkata
    driverClassName: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    dialect: POSTGRES

jpa:
  default:
    properties:
      hibernate:
        hbm2ddl:
          auto: update
        show_sql: false
    entity-scan:
      packages: 'com.bit.recall'

bit-recall:
  base64:
    secret: ${BASE64_SECRET}
  content:
    max-tokens: 20000

resilience4j:
  ratelimiter:
    configs:
      default:                     # base template
        limitForPeriod: 5
        limitRefreshPeriod: 10s
        timeoutDuration: 0ms
    instances:
      aiServiceRateLimiter:
        baseConfig: default

openapi:
  url: http://localhost:8080